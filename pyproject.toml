[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mope"
version = "1.0.0"
description = "Mixture of Pathway Experts: transcriptome-guided learning from routine histology"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.setuptools]
packages = ["mope"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
